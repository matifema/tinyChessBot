name = "giorgio-immobiliare-webapp"
compatibility_date = "2025-12-27"

# This project is a Cloudflare Pages + Next.js app.
# For local development, use:
#   npx wrangler pages dev giorgio-immobiliare-webapp -- npm run dev
#
# That runs the Next dev server and proxies through the Workers runtime so
# D1/R2 bindings are available to route handlers.

d1_databases = [
  { binding = "DB", database_name = "giorgio-immobiliare", database_id = "REPLACE_ME" }
]

r2_buckets = [
  { binding = "IMAGES", bucket_name = "giorgio-immobiliare-images" }
]
